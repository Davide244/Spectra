# Continuous integration for Spectra Engine.
#
# WHY TWO HOSTS RATHER THAN ONE. .NET NativeAOT cannot cross-compile: ILC emits
# object code for the host architecture and then hands it to the host's own
# linker (MSVC link.exe on Windows, clang/lld on Linux). So an AOT regression on
# one platform is completely invisible from the other, and the publish gate has
# to be duplicated per host rather than run once and assumed to generalise. The
# same is true of the trim/AOT analysers' input set, which differs with the
# runtime pack that gets restored.
#
# Test projects run via `dotnet run --project Test/<name>`, NEVER `dotnet test`:
# they are xUnit v3 on Microsoft.Testing.Platform and each test project is its
# own executable.

name: CI

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

# A superseded push has nothing to prove. Cancels in-flight runs for the same
# ref, never for a different one.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:

  # ---------------------------------------------------------------------------
  # 1. Windows: full solution build plus every suite that can run on a hosted
  #    runner. This is the reference job, because Windows is the only host where
  #    the whole solution compiles (see the VSIX note in test-linux).
  # ---------------------------------------------------------------------------
  test-windows:
    name: Test (Windows)
    runs-on: windows-latest
    steps:
      - name: Check out
        uses: actions/checkout@v4
        with:
          # The Box3D submodule is fetched but deliberately NOT built here: the
          # native build is a separate concern (native/build-box3d.ps1, CMake and
          # MSVC) and is out of scope for this pass. Fetching the source costs
          # little and keeps the checkout honest about what the repo contains.
          submodules: recursive

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      # global.json pins only the test runner, not an SDK band, so the version
      # actually selected is worth printing when a build starts behaving oddly.
      - name: Report SDK
        run: dotnet --info

      - name: Build
        run: dotnet build

      - name: SpectraShade.Compiler.Tests
        run: dotnet run --project Test/SpectraShade.Compiler.Tests

      - name: SpectraEngine.Bsp.Tests
        run: dotnet run --project Test/SpectraEngine.Bsp.Tests

      - name: SpectraEngine.Editing.Tests
        run: dotnet run --project Test/SpectraEngine.Editing.Tests

      - name: SpectraEngine.Editor.Tests
        run: dotnet run --project Test/SpectraEngine.Editor.Tests

      # The physics suite runs, but only half of it can: 26 of its 53 tests are
      # guarded by File.Exists(box3d.dll) beside the test binary and skip
      # themselves when the native library was never built. That is a real gap
      # rather than a clean pass, so it is stated in the summary below instead of
      # being left to whoever reads the skip count.
      - name: SpectraEngine.Physics.Tests
        run: dotnet run --project Test/SpectraEngine.Physics.Tests

      - name: Note the unbuilt native half of the physics suite
        if: always()
        shell: pwsh
        run: |
          Write-Host '::warning title=Physics native tests skipped::box3d.dll is not built in CI, so 26 of 53 physics tests self-skip.'
          @(
            '### Physics suite: native half not covered',
            '',
            '`Test/SpectraEngine.Physics.Tests` ran, but **26 of its 53 tests skipped themselves**.',
            'They are guarded by `File.Exists(box3d.dll)` beside the test binary, and the native',
            'library is build output of the pinned `external/box3d` submodule which this workflow',
            'deliberately does not build.',
            '',
            'What still ran and is genuinely covered: the ABI layout checks against the committed',
            '`native/box3d-abi.manifest`, the brush hull maths, and the assembly boundary test.',
            'What did not: every test that steps a real Box3D world.'
          ) | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8

      # -----------------------------------------------------------------------
      # The OpenGL suite needs a real driver, which a hosted runner does not
      # have. PROBE rather than assume, and probe with the suite's OWN collection
      # fixture: it creates the same window and GL 3.3 core context the full run
      # needs, so the probe cannot disagree with the thing it is gating.
      #
      # An earlier attempt probed the OpenGLDrivers ICD registry key instead.
      # That was WRONG and is recorded so nobody reinvents it: the key is absent
      # on a developer machine whose driver works perfectly, so it reported "no
      # GL" and would have silently skipped a suite that passes 150 tests.
      #
      # No --no-build: Spectra.slnx excludes this project from the Debug solution
      # build (`<Build Solution="Debug|*" Project="false" />`), so `dotnet build`
      # above did not produce it and dotnet run has to.
      # -----------------------------------------------------------------------
      - name: Probe for a usable OpenGL driver
        id: glprobe
        shell: pwsh
        run: |
          dotnet run --project Test/SpectraEngine.Graphics.Tests -- -class "SpectraEngine.Graphics.Tests.GlColorSpaceTests"
          if ($LASTEXITCODE -eq 0) {
            'available=true' | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
            Write-Host 'OpenGL context created: the full graphics suite will run.'
          } else {
            'available=false' | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
            Write-Host 'No usable OpenGL context on this runner.'
          }
          # The probe reports; it never fails the job. Its verdict is acted on by
          # the next step, which is the one allowed to go red.
          exit 0

      - name: SpectraEngine.Graphics.Tests
        if: steps.glprobe.outputs.available == 'true'
        run: dotnet run --project Test/SpectraEngine.Graphics.Tests

      # A silently skipped suite is worse than a failing one, so the skip is an
      # annotation AND a summary block naming exactly what stopped being checked.
      - name: Say loudly that the graphics suite was skipped
        if: steps.glprobe.outputs.available != 'true'
        shell: pwsh
        run: |
          Write-Host '::warning title=Graphics suite SKIPPED::No OpenGL driver on this runner. 150 tests did not run, including every pixel oracle.'
          @(
            '## :warning: SpectraEngine.Graphics.Tests was SKIPPED',
            '',
            'The probe could not create an OpenGL 3.3 core context on this runner, so the whole',
            'suite was skipped. **This job is green with 150 tests unrun.**',
            '',
            'What is no longer being checked on this run:',
            '',
            '- Every pixel oracle: deferred lighting, shadows, tone-map resolve, world lines,',
            '  colour space, light shapes, geometry instancing.',
            '- The GPU-free classes that happen to live in the same project (COM ownership,',
            '  D3D12 PSO key, cbuffer packing, HLSL compilation, mesh buffer pool, window mode',
            '  latch, swap chain resize policy). They are lost with the rest because the GL and',
            '  non-GL classes in this project follow no naming convention that could separate',
            '  them, and a hardcoded list of the GPU-free ones would rot silently the first time',
            '  somebody added a twelfth.',
            '',
            'To restore this coverage, run the suite on a machine with a real driver:',
            '',
            '```',
            'dotnet run --project Test/SpectraEngine.Graphics.Tests',
            '```',
            '',
            'or move this job to a self-hosted runner with a GPU.'
          ) | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8

  # ---------------------------------------------------------------------------
  # 2. Linux: the suites that are genuinely headless. All five run against a
  #    GPU-free fake renderer or no renderer at all.
  # ---------------------------------------------------------------------------
  test-linux:
    name: Test (Linux)
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        # No submodules: nothing in this job builds native code, and the ABI
        # manifest the physics suite reads (native/box3d-abi.manifest) is a
        # committed repo file rather than submodule content.
        uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      # NOT `dotnet build` on the solution. SpectraShade.VSIX targets net472 and
      # imports $(VsSDKInstall)\Microsoft.VsSDK.targets, whose tooling is nine
      # Windows executables inside the Microsoft.VSSDK.BuildTools package, so the
      # solution as a whole cannot build here. Everything else in it can, and is
      # listed explicitly so that a project added later is a visible omission
      # rather than a silent one.
      #
      # Excluded from this list, and why:
      #   SpectraShade.VSIX  net472 + the Windows-only VS SDK targets, as above.
      - name: Build the cross-platform projects
        run: |
          dotnet build SpectraEngine.Core
          dotnet build SpectraEngine.Editing
          dotnet build SpectraEngine.Physics.Box3D
          dotnet build SpectraEngine.Editor
          dotnet build SpectraEngine.Executable
          dotnet build SpectraShade.Compiler
          dotnet build SpectraShade.Compiler.CLI
          dotnet build SpectraShade.LSP
          dotnet build Spectra.Kitchen
          dotnet build Spectra.Kitchen.CLI
          dotnet build Benchmarks/CsgBench

      # The five headless suites. Determined by reading the projects, not by
      # guessing:
      #   Compiler.Tests  lexer/parser/analyzer/codegen over string and file
      #                   fixtures. No engine, no renderer.
      #   Bsp.Tests       drives the scene through FakeRenderer.cs, the headless
      #                   Renderer whose GPU entry points do nothing.
      #   Editing.Tests   drives tools through StubRenderer.cs, whose GPU entry
      #                   points THROW, so a test that grew a graphics dependency
      #                   would fail rather than quietly acquire one. The
      #                   Silk.NET types it names are managed enums and
      #                   interfaces; no device or window is ever created.
      #   Editor.Tests    the shell's pure pieces only, per that project's own
      #                   csproj comment: scene tree replay, property panel
      #                   commit policy, document state, the virtual-key table.
      #                   It never initialises an Avalonia platform, on any OS,
      #                   which is what makes it display-independent here.
      #   Physics.Tests   the native half self-skips (see the Windows job); what
      #                   remains is managed struct layout against the committed
      #                   manifest plus pure hull maths.
      #
      # Excluded, and why:
      #   Graphics.Tests  needs a real GL driver and a real window. Probed for on
      #                   Windows, where a self-hosted GPU runner could supply
      #                   one; on a hosted Linux runner there is nothing to probe.
      - name: SpectraShade.Compiler.Tests
        run: dotnet run --project Test/SpectraShade.Compiler.Tests

      - name: SpectraEngine.Bsp.Tests
        run: dotnet run --project Test/SpectraEngine.Bsp.Tests

      - name: SpectraEngine.Editing.Tests
        run: dotnet run --project Test/SpectraEngine.Editing.Tests

      - name: SpectraEngine.Editor.Tests
        run: dotnet run --project Test/SpectraEngine.Editor.Tests

      - name: SpectraEngine.Physics.Tests
        run: dotnet run --project Test/SpectraEngine.Physics.Tests

      # Here as well as in the cooked-pack job below, and the second host is the
      # point: a pack is hashed by content, so a text asset checking out as CRLF
      # on one runner and LF on the other gives the two hosts different bytes for
      # one commit. The .gitattributes rules exist to stop that, and this suite -
      # which cooks the engine's own Assets and verifies the result - is what
      # would notice if one of them was ever dropped.
      - name: Spectra.Kitchen.Tests
        run: dotnet run --project Test/Spectra.Kitchen.Tests

  # ---------------------------------------------------------------------------
  # 3. The cooked-content gate: export a project from the demo, cook it, verify
  #    the pack, then run the asset-facing suite against cooked packs.
  #
  #    WHY THIS IS A JOB OF ITS OWN. Every other suite here resolves content out
  #    of the loose tree, which is the editor's workflow and is precisely why a
  #    material naming a texture nobody cooked looks perfectly fine in all of
  #    them: the loose file is mounted above the pack and answers. Only a run
  #    with the pack mounted ALONE, and strict, can see what a shipped build
  #    sees. That is what `scook verify` does and what the Kitchen suite pins.
  #
  #    WINDOWS ONLY, because the export half needs a graphics device: the scene
  #    it writes out does not exist until the render thread has built its meshes
  #    and textures, so unlike `--export-entity-schema` there is no headless form
  #    of the question. The cook and the verify halves are platform-free and run
  #    inside the Kitchen suite on both hosts already.
  # ---------------------------------------------------------------------------
  cooked-windows:
    name: Cooked pack gate (Windows)
    runs-on: windows-latest
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Build
        run: dotnet build

      # ----------------------------------------------------------------------
      # --exit-after-save is what makes this runnable unattended at all: the
      # demo is an interactive session and would otherwise sit at its window
      # forever, which in CI is not a slow step, it is a job that never ends.
      # The switch shuts the session down on the first published frame, by which
      # point the export is already on disk (it is written during the scene
      # load).
      #
      # continue-on-error, and the reason is specific rather than defensive: the
      # demo host installs Box3D physics unconditionally and box3d.dll is build
      # output of the pinned submodule, which no job here builds - so the render
      # thread throws DllNotFoundException AFTER the export lands and the process
      # exits non-zero having done its job. The next step decides on the artifact
      # rather than on the exit code, which is the honest test either way.
      #
      # The timeout is the real guard. A hosted runner with no usable device can
      # hang inside device creation, and a step that hangs burns the whole job's
      # budget with nothing to show.
      # ----------------------------------------------------------------------
      - name: Export a project from the demo
        id: export
        continue-on-error: true
        timeout-minutes: 6
        shell: pwsh
        run: dotnet run --project SpectraEngine.Executable -- d3d11 --save-project=${{ runner.temp }}/CookGate --exit-after-save

      - name: Decide whether the demo half ran
        id: exported
        shell: pwsh
        run: |
          $manifest = Get-ChildItem -Path '${{ runner.temp }}/CookGate' -Filter '*.spectraproj' -ErrorAction SilentlyContinue
          if ($manifest) {
            'available=true' | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
            Write-Host "Exported $($manifest[0].FullName)."
          } else {
            'available=false' | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
            Write-Host 'The demo produced no project on this runner.'
          }

      # Both of these are allowed to go red, and that is the point of the job:
      # from here on nothing needs a GPU, so a failure is about the content or
      # the cooker rather than about the runner.
      - name: Cook the exported project
        if: steps.exported.outputs.available == 'true'
        run: dotnet run --project Spectra.Kitchen.CLI -- cook ${{ runner.temp }}/CookGate --no-color

      - name: Verify the cooked pack
        if: steps.exported.outputs.available == 'true'
        run: dotnet run --project Spectra.Kitchen.CLI -- verify ${{ runner.temp }}/CookGate/cooked/Demo.spack --no-color

      # The pack's own row list, into the run summary. It costs one command and
      # it is what a bug report about a missing asset gets pasted from.
      - name: Record what is in the pack
        if: steps.exported.outputs.available == 'true'
        shell: pwsh
        run: |
          '### Cooked pack', '', '```' | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8
          dotnet run --project Spectra.Kitchen.CLI -- inspect ${{ runner.temp }}/CookGate/cooked/Demo.spack --no-color |
            Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8
          '```' | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8

      # A silently skipped half is worse than a failing one, so the skip is an
      # annotation AND a summary block naming exactly what stopped being checked
      # and what still is.
      - name: Say loudly that the export half was skipped
        if: steps.exported.outputs.available != 'true'
        shell: pwsh
        run: |
          Write-Host '::warning title=Demo export SKIPPED::The demo produced no project on this runner, so the executable-driven half of the cook chain did not run.'
          @(
            '## :warning: The demo export did not run',
            '',
            'The `demo --save-project` -> `scook cook` -> `scook verify` chain stopped at its first',
            'step, so nothing on this run cooked the scene the demo actually authors.',
            '',
            'The likely cause is `box3d.dll`: the demo host installs Box3D physics unconditionally,',
            'the library is build output of the pinned `external/box3d` submodule, and no job in this',
            'workflow builds it. A second possibility is that this runner has no usable D3D11 device.',
            '',
            'What still ran and is genuinely covered: `Test/Spectra.Kitchen.Tests` below, which cooks',
            "the engine's own `Assets/` in process and verifies the pack with only that pack mounted,",
            'strict - the same claim `scook verify` makes, over the same content, through the same',
            'library. What did not: the demo scene, its exported project layout, and the CLI itself.'
          ) | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8

      # Always, export or no export. This is the asset-facing suite run against
      # cooked packs rather than against the loose tree: it cooks real content,
      # mounts the result alone and strict, and holds both halves of the
      # loud-cooker / soft-runtime asymmetry in one test so that neither can be
      # "fixed" to match the other.
      - name: Spectra.Kitchen.Tests
        run: dotnet run --project Test/Spectra.Kitchen.Tests

  # ---------------------------------------------------------------------------
  # 4. Windows AOT publish. The engine ships NativeAOT, so this is the gate that
  #    catches a reflection pattern the ordinary build tolerates.
  # ---------------------------------------------------------------------------
  aot-windows:
    name: AOT publish (Windows)
    runs-on: windows-latest
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      # DO NOT DELETE THIS STEP. The ilcompiler shells out to the MSVC linker
      # through its own findvcvarsall.bat, and vcvarsall.bat calls vswhere.exe
      # UNQUALIFIED. With the VS Installer directory off PATH, the batch file's
      # error text is captured as the linker path and the publish dies with
      #
      #   error MSB3073: The command ""'vswhere.exe' is not recognized as an
      #   internal or external command,;operable program or batch file.;
      #   ...\link.exe" @"...\link.rsp"" exited with code 123
      #
      # which says nothing about the code and sends people looking in the wrong
      # place. Reproduced verbatim on a developer machine and fixed by exactly
      # this line. GITHUB_PATH prepends for every later step in the job.
      - name: Put the VS Installer directory on PATH
        shell: pwsh
        run: |
          $installer = 'C:\Program Files (x86)\Microsoft Visual Studio\Installer'
          if (-not (Test-Path (Join-Path $installer 'vswhere.exe'))) {
            # Loud rather than a confusing MSB3073 several minutes later.
            Write-Host "::warning title=vswhere.exe not found::Expected it in $installer. The AOT publish is about to fail with MSB3073 exit code 123."
          }
          Add-Content -Path $env:GITHUB_PATH -Value $installer

      # NO -p:PublishAot=true. It is redundant (the three projects that want it
      # set it themselves) and it is worse than redundant: a command-line -p: is a
      # GLOBAL property that reaches every project in the graph, including
      # SpectraEngine.Entities.Generator, which targets netstandard2.0 because a
      # Roslyn analyzer must. The SDK then refuses the whole publish with
      # NETSDK1207 naming the generator, which is not where anything is wrong, and
      # UndefineProperties cannot save it because the failure happens during
      # restore. These four steps were written before the generator existed and
      # would every one of them have failed on the first run of this workflow.
      - name: Publish SpectraEngine.Executable (win-x64)
        run: dotnet publish SpectraEngine.Executable -c Release -r win-x64

      - name: Publish SpectraShade.Compiler.CLI (win-x64)
        run: dotnet publish SpectraShade.Compiler.CLI -c Release -r win-x64

  # ---------------------------------------------------------------------------
  # 5. Linux AOT publish. Same two binaries, the other toolchain.
  # ---------------------------------------------------------------------------
  aot-linux:
    name: AOT publish (Linux)
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      # NativeAOT on Linux links with clang and needs the zlib headers, which is
      # the Linux counterpart of the Windows job's MSVC linker dependency. Both
      # are usually present on ubuntu-latest; naming them means a runner image
      # that drops one fails at apt time with a clear message rather than inside
      # ILC.
      - name: Install the NativeAOT prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y clang zlib1g-dev

      # NO -p:PublishAot=true. It is redundant (the three projects that want it
      # set it themselves) and it is worse than redundant: a command-line -p: is a
      # GLOBAL property that reaches every project in the graph, including
      # SpectraEngine.Entities.Generator, which targets netstandard2.0 because a
      # Roslyn analyzer must. The SDK then refuses the whole publish with
      # NETSDK1207 naming the generator, which is not where anything is wrong, and
      # UndefineProperties cannot save it because the failure happens during
      # restore. These four steps were written before the generator existed and
      # would every one of them have failed on the first run of this workflow.
      - name: Publish SpectraEngine.Executable (linux-x64)
        run: dotnet publish SpectraEngine.Executable -c Release -r linux-x64

      - name: Publish SpectraShade.Compiler.CLI (linux-x64)
        run: dotnet publish SpectraShade.Compiler.CLI -c Release -r linux-x64
